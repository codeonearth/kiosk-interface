<div class="auth-container">

  <h1 class="auth-title">Choose Authentication Method</h1>
  <p class="auth-subtitle">Secure access to kiosk services</p>

  <!-- ================= SELECTION SCREEN ================= -->
  <ng-container *ngIf="selectedMethod === null">

    <div class="auth-new">
      <button class="dept-card fingerprint"
              (click)="selectAuth('fingerprint')">
        <span class="icon">🖐️</span>
        <span>FINGERPRINT</span>
      </button>

      <button class="dept-card otp"
              (click)="selectAuth('otp')">
        <span class="icon">📱</span>
        <span>OTP</span>
      </button>
    </div>

  </ng-container>


  <!-- ================= FINGERPRINT ================= -->
  <ng-container *ngIf="selectedMethod === 'fingerprint'">

    <div class="auth-box">
      <div class="fingerprint-icon">🖐️</div>
      <p>Place your finger on the scanner</p>

      <button class="auth-btn"
              (click)="verifyFingerPrint()">
        Authenticate
      </button>

      <button class="back-btn"
              (click)="goBack()">
        Back
      </button>
    </div>

  </ng-container>


  <!-- ================= OTP ================= -->
  <ng-container *ngIf="selectedMethod === 'otp'">

    <div class="auth-box">

      <p>Enter 6 Digit OTP</p>

      <input type="text"
             maxlength="6"
             [value]="otp"
             readonly
             (click)="showKeyboard = true"
             class="otp-input"
             placeholder="------" />

      <!-- 🔥 Custom Keyboard -->
      <div class="keyboard" *ngIf="showKeyboard">

        <button *ngFor="let key of keys"
                (click)="pressKey(key)">
          {{ key }}
        </button>

        <button class="backspace"
                (click)="backspace()">⌫</button>

      </div>

      <button class="auth-btn"
              (click)="verifyOtp()">
        Authenticate
      </button>

      <button class="back-btn"
              (click)="goBack()">
        Back
      </button>

    </div>

  </ng-container>

</div>
